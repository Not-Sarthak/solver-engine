services:
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    solver:
        build: .
        env_file: .env
        environment:
            REDIS_URL: redis://redis:6379
        ports:
            - "4000:4000"
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped

volumes:
    redis:
